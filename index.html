<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff1f4">
  <title>A Little Place for You ♡</title>
  <style>
    :root{--rose:#d94f70;--deep:#8e2342;--pink:#fff1f4;--ink:#432b35;--muted:#8c6b76;--card:rgba(255,255,255,.82)}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;font-family:Georgia,'Times New Roman',serif;color:var(--ink);background:linear-gradient(145deg,#fff7f8,#ffe5eb 55%,#fff7f4);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:radial-gradient(#d94f70 1px,transparent 1px);background-size:25px 25px;z-index:-1}
    .wrap{width:min(1050px,92%);margin:auto}.hero{min-height:92vh;display:grid;place-items:center;text-align:center;padding:60px 18px;position:relative}
    .eyebrow{letter-spacing:.22em;text-transform:uppercase;font:11px Arial,sans-serif;color:var(--rose)}
    h1{font-size:clamp(3rem,9vw,6.8rem);font-weight:normal;line-height:.98;margin:20px 0;color:var(--deep)}
    .hero p{max-width:550px;margin:0 auto 28px;font-size:1.15rem;line-height:1.8;color:#75505c}
    .button{border:0;border-radius:999px;padding:14px 23px;background:var(--rose);color:white;font-size:14px;cursor:pointer;box-shadow:0 8px 22px #d94f7030;transition:.2s}
    .button:hover{transform:translateY(-2px);background:var(--deep)}.button.secondary{background:white;color:var(--deep);border:1px solid #f0bdca;box-shadow:none}
    .heart{font-size:22px;color:var(--rose);animation:pulse 1.8s infinite}@keyframes pulse{50%{transform:scale(1.2)}}
    section{padding:65px 0}.section-title{text-align:center;font-size:clamp(2rem,5vw,3.2rem);font-weight:normal;color:var(--deep);margin:0 0 12px}.sub{text-align:center;color:var(--muted);margin:0 auto 32px;max-width:560px;line-height:1.7}
    .card{background:var(--card);border:1px solid #fff;border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:0 12px 40px #8e23420c;backdrop-filter:blur(8px)}
    .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.photo{min-height:220px;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#fbd4de,#fff);display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;color:#a24c66;position:relative}
    .photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.photo span{z-index:1;font-size:14px;line-height:1.5}.photo.has-image span{display:none}
    .letter-card{max-width:720px;margin:auto;text-align:center}.envelope{font-size:65px;margin:8px 0 18px}.letter{display:none;text-align:left;white-space:pre-line;font-size:1.12rem;line-height:1.95;color:#65434f}.letter.show{display:block}.letter-sign{color:var(--rose);font-style:italic}
    .quiz{max-width:720px;margin:auto}.question{font-size:1.25rem;line-height:1.6;margin:8px 0 18px}.answers{display:grid;gap:10px}.answer{border:1px solid #f0c5d0;border-radius:14px;padding:13px 15px;text-align:left;background:#fff9fa;color:var(--ink);cursor:pointer;font:15px Arial,sans-serif}.answer:hover{background:#ffe5eb}.answer:disabled{cursor:default;opacity:.8}.feedback{min-height:28px;color:var(--deep);margin-top:16px;line-height:1.6}
    .countdown{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:26px 0}.timebox{min-width:85px;padding:17px 12px;border-radius:16px;background:white;border:1px solid #f6d1da;text-align:center}.timebox strong{display:block;font-size:2rem;font-weight:normal;color:var(--deep)}.timebox span{font:10px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
    .music-row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}.small{font:12px Arial,sans-serif;color:var(--muted);line-height:1.6}.footer{text-align:center;padding:35px 10px 55px;color:var(--muted);font-size:14px}
    .sparkle{position:absolute;opacity:.45;color:var(--rose);font-size:22px}.s1{top:17%;left:12%}.s2{right:12%;top:25%}.s3{bottom:17%;right:18%}

    /* Lockdown & Password Screen Styles */
    #lockdown-screen{position:fixed;inset:0;background:linear-gradient(145deg,#fff7f8,#ffe5eb 55%,#fff7f4);color:var(--ink);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
    #lockdown-screen:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:radial-gradient(#d94f70 1px,transparent 1px);background-size:25px 25px;z-index:-1}
    .lock-card{background:var(--card);border:1px solid #fff;border-radius:28px;padding:clamp(28px,5vw,48px);box-shadow:0 16px 48px #8e234214;backdrop-filter:blur(10px);max-width:540px;width:100%}
    .lock-title{font-size:clamp(2rem,5vw,3rem);font-weight:normal;color:var(--deep);margin:12px 0}
    .lock-sub{color:var(--muted);font-size:1.05rem;line-height:1.7;margin:0 0 24px}

    /* Password Box Styles */
    .pass-form{display:flex;flex-direction:column;gap:12px;max-width:320px;margin:20px auto 12px}
    .pass-input{width:100%;padding:14px 18px;border-radius:999px;border:1px solid #f0bdca;background:#fff;color:var(--ink);font:15px Arial,sans-serif;text-align:center;outline:none;transition:.2s}
    .pass-input:focus{border-color:var(--rose);box-shadow:0 0 0 3px #d94f7022}
    .pass-error{color:var(--rose);font:bold 13px Arial,sans-serif;letter-spacing:.08em;min-height:20px;margin:6px 0 0}
    .pass-hint{background:#fff9fa;border:1px dashed #f0bdca;border-radius:14px;padding:10px 14px;margin-top:16px;font:13px Arial,sans-serif;color:var(--muted);line-height:1.5}
    .pass-hint strong{color:var(--deep)}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .shake{animation:shake .3s ease-in-out}

    @media(max-width:650px){.gallery{grid-template-columns:1fr}.photo{min-height:260px}.hero{min-height:85vh}.timebox{min-width:68px}.timebox strong{font-size:1.6rem}}
  </style>
</head>
<body>
  <!-- Countdown & Password Lockdown Overlay -->
  <div id="lockdown-screen">
    <div class="lock-card" id="lock-card">
      
      <!-- STAGE 1: Countdown View -->
      <div id="countdown-stage">
        <div class="eyebrow">not yet ya batotyy ♡</div>
        <h2 class="lock-title">Locked Until Your Day 🔒</h2>
        <p class="lock-sub">Estany l7d m el wa2t ye5ls😝😝</p>
        <div class="countdown" aria-live="polite">
          <div class="timebox"><strong id="lock-days">—</strong><span>Days</span></div>
          <div class="timebox"><strong id="lock-hours">—</strong><span>Hours</span></div>
          <div class="timebox"><strong id="lock-minutes">—</strong><span>Minutes</span></div>
          <div class="timebox"><strong id="lock-seconds">—</strong><span>Seconds</span></div>
        </div>
        <p class="small">December 25
